:root {

* { margin: 0; padding: 0; box-sizing: border-box; }
body {

background: linear-gradient(-45deg, var(--valentine-deep-red), var(--valentine-strong-pink), var(--valentine-soft-pink));
background-size: 400% 400%; 
animation: gradientMove 10s ease-in-out infinite;
position: relative; overflow-x: hidden;
}
@keyframes gradientMove { 
0% { background-position: 0% 50%; } 
25% { background-position: 100% 50%; }
50% { background-position: 100% 100%; }
75% { background-position: 0% 100%; }
100% { background-position: 0% 50%; }
}
.background-shapes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
.particle { position: absolute; pointer-events: none; opacity: 0.6; animation: floatParticle 8s ease-in-out infinite; }
.particle.heart { font-size: 20px; color: #ff6b9d; animation: floatHeart 10s ease-in-out infinite; }
.particle.sparkle { width: 8px; height: 8px; background: radial-gradient(circle, #feca57, #ff9ff3); border-radius: 50%; animation: floatSparkle 6s ease-in-out infinite; }
.particle.star { font-size: 16px; color: #c44569; animation: floatStar 12s ease-in-out infinite; }
@keyframes floatParticle {
0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.3; }
25% { transform: translateY(-30px) translateX(15px) rotate(90deg); opacity: 0.7; }
50% { transform: translateY(-20px) translateX(-10px) rotate(180deg); opacity: 0.5; }
75% { transform: translateY(-40px) translateX(20px) rotate(270deg); opacity: 0.8; }
}
@keyframes floatHeart {
0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); opacity: 0.4; }
33% { transform: translateY(-50px) scale(1.2) rotate(15deg); opacity: 0.8; }
66% { transform: translateY(-30px) scale(0.8) rotate(-10deg); opacity: 0.6; }
}
@keyframes floatSparkle {
0%, 100% { transform: translateY(0px) scale(1); opacity: 0.5; box-shadow: 0 0 10px #feca57; }
50% { transform: translateY(-40px) scale(1.5); opacity: 1; box-shadow: 0 0 20px #ff9ff3; }
}
@keyframes floatStar {
0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); opacity: 0.4; }
25% { transform: translateY(-35px) rotate(180deg) scale(1.1); opacity: 0.7; }
50% { transform: translateY(-60px) rotate(360deg) scale(0.9); opacity: 0.9; }
75% { transform: translateY(-25px) rotate(540deg) scale(1.2); opacity: 0.6; }
}
/* === PARTÍCULAS REACTIVAS AL MOUSE === */
.mouse-particle {
position: fixed;
left: 0;
top: 0;
border-radius: 50%;
pointer-events: none;
opacity: 0;
transition: transform 1s ease-out, opacity 1s ease-out;
z-index: 1;
}

.shape { 
position: absolute; border-radius: 50%; opacity: 0.08; 
animation: float 15s ease-in-out infinite; 
}
.shape:nth-child(1) { width: 80px; height: 80px; background: #ff6b9d; top: 10%; left: 10%; }
.shape:nth-child(2) { width: 120px; height: 120px; background: #c44569; top: 20%; right: 15%; animation-delay: 2s; }
.shape:nth-child(3) { width: 60px; height: 60px; background: #f8b500; bottom: 20%; left: 20%; animation-delay: 4s; }
.shape:nth-child(4) { width: 100px; height: 100px; background: #ff6b9d; bottom: 10%; right: 10%; animation-delay: 1s; }
@keyframes float {
0% { transform: translateY(0) rotate(0deg); }
33% { transform: translateY(-20px) rotate(45deg); }
66% { transform: translateY(15px) rotate(-30deg); }
100% { transform: translateY(0) rotate(0deg); }

function getCurrentRotation(element) {
    const st = window.getComputedStyle(element, null);
    const tm = st.getPropertyValue("-webkit-transform") ||
               st.getPropertyValue("-moz-transform") ||
               st.getPropertyValue("-ms-transform") ||
               st.getPropertyValue("-o-transform") ||
               st.getPropertyValue("transform") ||
               "none";
    if (tm !== "none") {
        const values = tm.split('(')[1].split(')')[0].split(',');
        const a = values[0];
        const b = values[1];
        const angle = Math.round(Math.atan2(b, a) * (180/Math.PI));
        return (angle < 0) ? angle + 360 : angle;
    }
    return 0;
}

// NUEVA FUNCIÓN: Verificar progreso de premios únicos
function verificarProgresoPremiosUnicos() {
    if (!premiosActuales || premiosActuales.length === 0) return { total: 0, ganados: 0, restantes: 0 };
    const premiosYaGanados = historialPremios.map(item => item.nombre);

    return {
        total: premiosUnicos.length,
        ganados: premiosUnicosGanados.length,
        restantes: premiosUnicos.length - premiosUnicosGanados.length
    };
}

function dibujarRuletaCompleta() {
// Solo dibujar usando premiosDisponibles (ya cargados por inicializarPagina)
if (!premiosDisponibles || premiosDisponibles.length === 0) {
console.error('No hay premios disponibles para dibujar la ruleta');

const canvas = document.getElementById('opciones');

return;
}

const ctx = canvas.getContext('2d');
const total = premiosDisponibles.length;
const radio = 220;
const centroX = 225;
const centroY = 225;

ctx.clearRect(0, 0, 450, 450);

for (let i = 0; i < total; i++) {
const anguloInicio = (2 * Math.PI / total) * i;
const anguloFin = (2 * Math.PI / total) * (i + 1);

ctx.save();
ctx.beginPath();
ctx.moveTo(centroX, centroY);
ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
ctx.closePath();
                ctx.fillStyle = coloresPremios[i % coloresPremios.length];
                
                // 🎨 COLORES CON MEJOR TRANSPARENCIA PARA EL FONDO PERSONALIZADO
                const baseColor = coloresPremios[i % coloresPremios.length];
                ctx.fillStyle = baseColor + 'E6'; // Agregar transparencia para que se vea el fondo
ctx.fill();
                
                // 🎨 SOMBRA SUTIL PARA MEJOR DEFINICIÓN
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 3;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fill();
                
ctx.clip();

                // 🎨 TEXTO CON MEJOR CONTRASTE
ctx.fillStyle = "#ffffff";
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
const anguloMedio = (anguloInicio + anguloFin) / 2;
const distanciaTexto = radio * 0.65;
const textoX = centroX + Math.cos(anguloMedio) * distanciaTexto;
const textoY = centroY + Math.sin(anguloMedio) * distanciaTexto;

ctx.translate(textoX, textoY);
let rotacion = anguloMedio;
if (rotacion > Math.PI/2 && rotacion < 3*Math.PI/2) rotacion += Math.PI;
ctx.rotate(rotacion);

let textoLimpio = premiosDisponibles[i].trim().toUpperCase();
const palabras = textoLimpio.split(' ');
let lineas = [], lineaActual = '';
palabras.forEach(palabra => {
if ((lineaActual + palabra).length > 10 && lineaActual) {
lineas.push(lineaActual.trim());
lineaActual = palabra + ' ';
} else {
lineaActual += palabra + ' ';
}
});
lineas.push(lineaActual.trim());

ctx.textAlign = "center";
ctx.textBaseline = "middle";

// Tamaño de fuente responsivo basado en el ancho de pantalla

if (window.innerWidth <= 360) {

lineHeight = 13;

fontSize = 14;
lineHeight = 16;
} else if (window.innerWidth <= 992) {
fontSize = 15;
lineHeight = 17;
}

ctx.font = `bold ${fontSize}px Poppins, sans-serif`;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;

const startY = -(lineas.length - 1) * lineHeight / 2;

ctx.restore();
}

            ctx.strokeStyle = "#ffffff";

            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 2;
            ctx.shadowOffsetX = 1;

for (let i = 0; i < total; i++) {
const anguloFin = (2 * Math.PI / total) * (i + 1);
ctx.beginPath();
ctx.moveTo(centroX, centroY);
ctx.lineTo(centroX + radio * Math.cos(anguloFin), centroY + radio * Math.sin(anguloFin));
ctx.stroke();
}

            // Círculo central responsivo

if (window.innerWidth <= 360) {

emojiSize = 28;

            // Círculo con efecto de vidrio

            ctx.fillStyle = "#c44569";
            
            // Gradiente radial para efecto de vidrio
            const gradient = ctx.createRadialGradient(centroX, centroY, 0, centroX, centroY, circleRadius);

            ctx.fillStyle = gradient;
ctx.fill();
            
            // Borde con sombra

            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';

ctx.textBaseline = "middle";

}

        async function girarRuleta() {
            if (tiradasRestantes <= 0 || premiosActuales.length === 0) return;

            // Lógica para no repetir premios
            const premiosYaGanados = historialPremios.map(item => item.nombre);
            const premiosDisponiblesParaEsteGiro = premiosActuales.filter(premio => !premiosYaGanados.includes(premio));

            if (premiosDisponiblesParaEsteGiro.length === 0) {
                mostrarNotificacion("¡Ya has ganado todos los premios disponibles! 🎉", "success");
                mostrarMensaje(`🎉 ¡Felicidades ${nombreUsuario}! Ya tienes todos los premios únicos.`);
                document.getElementById('girarBtn').disabled = true;
                return; // Detener la ejecución si no hay más premios únicos que ganar
            }

            // Configurar estado de carga del botón
            const girarBtn = document.getElementById('girarBtn');
            girarBtn.disabled = true;
            girarBtn.textContent = 'Girando... 🎲';

            soundSpin.loop = true;
            soundSpin.play();
            
            // El servidor elige el premio y descuenta la tirada (PostgreSQL, atómico e idempotente)
            const __giro = await window.__girarEnServidor();
            if (!__giro || !__giro.success) { window.__giroFallido(__giro); return; }
            const premioGanado = __giro.premio;
            const indiceEnRuletaCompleta = premiosDisponibles.findIndex(p => p === premioGanado);

            if (indiceEnRuletaCompleta === -1) {
                mostrarNotificacion("Error de configuración. Por favor, intenta de nuevo.", "error");
                soundSpin.pause();
                return;
            }
            // --- INICIO DEL BLOQUE A REEMPLAZAR EN girarRuleta() ---
            const opcionesCanvas = document.getElementById('opciones');

            // 1. Obtener la rotación actual y detener la animación CSS
            const currentAngle = getCurrentRotation(opcionesCanvas);
            opcionesCanvas.classList.remove('is-idling');
            opcionesCanvas.style.transition = 'none'; // Evitar transiciones no deseadas
            opcionesCanvas.style.transform = `rotate(${currentAngle}deg)`;

            // Forzar un reflow del navegador para aplicar el transform estático antes de la transición
            opcionesCanvas.offsetWidth; 

            // 2. Calcular el ángulo final del giro
            const anguloPorPremio = 360 / premiosDisponibles.length;
            // Se añaden varias vueltas + el ángulo del premio + el ángulo actual
            const anguloDeGiro = (360 * 6) + (indiceEnRuletaCompleta * anguloPorPremio) + (anguloPorPremio / 2);
            const anguloFinalTotal = currentAngle + anguloDeGiro;

            // 3. Aplicar la transición para el giro rápido
            opcionesCanvas.style.transition = "transform 5s cubic-bezier(.17,.67,.83,.67)";
            opcionesCanvas.style.transform = `rotate(${anguloFinalTotal}deg)`;

            mostrarMensaje("🎯 ¡La ruleta está girando mágicamente! ✨");

            // 4. Procesar el resultado después de que termine el giro
            setTimeout(async () => {
                soundSpin.pause();
                soundSpin.currentTime = 0;
                soundWin.play();

                confetti({
                    particleCount: 200,
                    spread: 100,
                    origin: { y: 0.6 },
                    gravity: 0.8
                });

                // Detener la transición para que la ruleta se quede fija en el premio
                opcionesCanvas.style.transition = 'none';

                // La lógica del premio, historial y tiradas restantes sigue aquí...
                // (El resto del código dentro del setTimeout original)
                mostrarPopupPremio(premioGanado);
                mostrarMensaje(`🎉 ¡Felicidades ${nombreUsuario}! Ganaste: <b>${premioGanado}</b>`);
                agregarPremioAlHistorial(premioGanado);

                tiradasRestantes = __giro.tiradasRestantes; // ya descontada en el servidor


                // NUEVA LÓGICA: Verificar si se han ganado todos los premios únicos
                const premiosYaGanadosActualizados = historialPremios.map(item => item.nombre);
                const premiosUnicos = [...new Set(premiosActuales)]; // Eliminar duplicados si los hay
                const todosLosPremiosGanados = premiosUnicos.every(premio => premiosYaGanadosActualizados.includes(premio));

                if (tiradasRestantes > 0 && !todosLosPremiosGanados) {
                    // Aún hay tiradas y premios únicos por ganar
                    setTimeout(() => {
                        document.getElementById('girarBtn').disabled = false;
                        document.getElementById('girarBtn').textContent = '✨ Girar Ruleta ✨';
                        const progreso = verificarProgresoPremiosUnicos();
                        mostrarMensaje(`✨ ¡Tienes ${tiradasRestantes} tirada(s) más! Te faltan ${progreso.restantes} premio(s) por ganar.`);
                    }, 3000);
                } else if (todosLosPremiosGanados) {

                    setTimeout(() => {
                        document.getElementById('girarBtn').disabled = true;
                        document.getElementById('girarBtn').textContent = '🏆 ¡Todos los premios obtenidos!';
                        mostrarMensaje(`🎉 ¡Increíble ${nombreUsuario}! Has ganado todos los premios únicos disponibles 🏆✨`);
                        mostrarNotificacion(`¡Felicidades! Has completado todos los premios únicos �`, 'success');

}

async function validarCodigo() {
soundClick.play();
const codigoInput = document.getElementById('codigo');
const validarBtn = document.getElementById('validarBtn');
const codigo = codigoInput.value.trim().toUpperCase();

if (!codigo) {
mostrarMensaje("❌ Por favor ingresa un código.");
codigoInput.style.animation = 'shake 0.5s ease-in-out';
setTimeout(() => { codigoInput.style.animation = ''; }, 500);
return;
}

validarBtn.disabled = true;
validarBtn.textContent = '⏳ Validando...';
mostrarMensaje("🔍 Validando tu código...");

try {
const response = await fetch('/.netlify/functions/validate-code', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
},
body: JSON.stringify({ codigoId: codigo })
});

const result = await response.json();

if (response.status === 200 && result.success) {
const datosCodigo = result.data;

codigoActual = codigo;
nombreUsuario = datosCodigo.nombreFan;

// ✅ CORRECCIÓN: Mejorar gestión de premiosActuales
if (datosCodigo.premios && Array.isArray(datosCodigo.premios) && datosCodigo.premios.length > 0) {
// Usar premios específicos del código
premiosActuales = [...datosCodigo.premios];
console.log('✅ Usando premios específicos del código:', premiosActuales);
} else if (premiosDisponibles && premiosDisponibles.length > 0) {
// Fallback a premios globales
premiosActuales = [...premiosDisponibles];
console.log('⚠️ Usando premios globales como fallback:', premiosActuales);
} else {
// Último fallback a premios por defecto
premiosActuales = ['Premio Sorpresa', 'Pack Fotos Hot', 'Videollamada 5 minutos'];
console.warn('⚠️ Usando premios por defecto - no hay premios configurados');
}

tiradasRestantes = datosCodigo.tiradasRestantes || 0;

mostrarNotificacion(`¡Bienvenida ${nombreUsuario}! Código válido con ${tiradasRestantes} tirada(s) 🎉`, 'success');

// Habilitar botón de girar solo si hay tiradas disponibles
const girarBtn = document.getElementById('girarBtn');
if (girarBtn) {
    girarBtn.disabled = tiradasRestantes <= 0;
}

codigoInput.disabled = true;
validarBtn.disabled = true;

codigoInput.style.borderColor = '#10ac84';
validarBtn.style.background = 'linear-gradient(45deg, #10ac84, #00d2d3)';
validarBtn.textContent = '✅ Código Válido';

// Inicializar el historial de premios
window.__historialDesdeServidor(result.data); inicializarHistorial(); if (!historialPremios.length && window.__historialServidor && window.__historialServidor.length) { historialPremios = window.__historialServidor.slice(); contadorPremios = historialPremios.length; actualizarHistorialVisual(); }

// Debe ejecutarse primero
const progreso = verificarProgresoPremiosUnicos();
if (progreso.completado) {
    mostrarMensaje(`💖 ¡Hola ${nombreUsuario}! Parece que ya has ganado todos los ${progreso.total} premios. ¡Felicidades!`);
    girarBtn.disabled = true;
} else {
    mostrarMensaje(`💖 ¡Hola ${nombreUsuario}! Tienes ${tiradasRestantes} tirada(s) para ganar ${progreso.restantes} premio(s) restante(s). ¡Mucha suerte!`);
}

} else {
mostrarNotificacion(`${result.message || 'Código no válido o sin tiradas disponibles'}`, 'error');
mostrarMensaje(`❌ ${result.message || 'Error al validar el código'}`);
codigoInput.style.animation = 'shake 0.5s ease-in-out';
setTimeout(() => { codigoInput.style.animation = ''; }, 500);
}

} catch (error) {
console.error('Error de conexión al validar código:', error);
mostrarNotificacion("Error de conexión. Por favor, verifica tu internet e inténtalo de nuevo.", 'error');
mostrarMensaje("❌ Error de conexión. Por favor, verifica tu internet e inténtalo de nuevo.");
codigoInput.style.animation = 'shake 0.5s ease-in-out';
setTimeout(() => { codigoInput.style.animation = ''; }, 500);
} finally {
if (validarBtn.textContent !== '✅ Código Válido') {
validarBtn.disabled = false;
validarBtn.textContent = '✨ Validar Código ✨';
}
}
}

// === FONDO INTERACTIVO REACTIVO AL MOUSE ===
function inicializarFondoInteractivo() {
const paleta = ['#ff6b9d', '#ffffff', '#f8b500', '#c44569', '#feca57', '#23a6d5', '#ff9a9e', '#8a2be2'];
let throttleTimer = null;

// Efecto épico de bienvenida
crearExplosionBienvenida(paleta);

document.addEventListener('mousemove', function(e) {
// Throttle para mejor rendimiento
if (throttleTimer) return;

throttleTimer = setTimeout(() => {
throttleTimer = null;
}, 50); // Crear partícula cada 50ms máximo

crearParticulaMouse(e.clientX, e.clientY, paleta);
});
}

function crearExplosionBienvenida(paleta) {
const centroX = window.innerWidth / 2;
const centroY = window.innerHeight / 2;

// Crear 30 partículas desde el centro
for (let i = 0; i < 30; i++) {
setTimeout(() => {
crearParticulaBienvenida(centroX, centroY, paleta, i);
}, i * 50); // Escalonar la creación
}
}

function crearParticulaBienvenida(x, y, paleta, index) {
const particula = document.createElement('div');
particula.className = 'mouse-particle';

// Tamaño más grande para el efecto de bienvenida
const tamaño = Math.random() * 30 + 10;
const color = paleta[Math.floor(Math.random() * paleta.length)];

// Configurar estilos iniciales
particula.style.cssText = `
               width: ${tamaño}px;
               height: ${tamaño}px;
               background: ${color};
               left: ${x - tamaño/2}px;
               top: ${y - tamaño/2}px;
               box-shadow: 0 0 ${tamaño}px ${color};
               opacity: 1;
               z-index: 5;
           `;

document.body.appendChild(particula);

// Animar hacia afuera en todas las direcciones
setTimeout(() => {
const angulo = (index / 30) * 2 * Math.PI;
const distancia = Math.random() * 300 + 200;
const moveX = Math.cos(angulo) * distancia;
const moveY = Math.sin(angulo) * distancia;
const scale = Math.random() * 1.5 + 0.5;

particula.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale}) rotate(720deg)`;
particula.style.opacity = '0';
}, 100);

// Limpiar después de la animación
setTimeout(() => {
if (particula.parentNode) {
document.body.removeChild(particula);
}
}, 1500);
}

function crearParticulaMouse(x, y, paleta) {
const particula = document.createElement('div');
particula.className = 'mouse-particle';

// Tamaño aleatorio entre 5px y 25px
const tamaño = Math.random() * 20 + 5;

// Color aleatorio de la paleta
const color = paleta[Math.floor(Math.random() * paleta.length)];

// Configurar estilos iniciales
particula.style.cssText = `
               width: ${tamaño}px;
               height: ${tamaño}px;
               background: ${color};
               left: ${x - tamaño/2}px;
               top: ${y - tamaño/2}px;
               box-shadow: 0 0 ${tamaño/2}px ${color};
               opacity: 0.8;
           `;

// Añadir al body
document.body.appendChild(particula);

// Animar inmediatamente
setTimeout(() => {
const moveX = (Math.random() - 0.5) * 80; // Movimiento horizontal aleatorio
const moveY = (Math.random() - 0.5) * 80; // Movimiento vertical aleatorio
const scale = Math.random() * 2 + 0.5; // Escala final aleatoria

particula.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;
particula.style.opacity = '0';
}, 10);

// Limpiar después de la animación
setTimeout(() => {
if (particula.parentNode) {
document.body.removeChild(particula);
}
}, 1000);
}

async function inicializarPagina() {

// 1. Crear elementos del DOM primero
crearElementosDOM();

// 2. Llamada única al backend para obtener toda la configuración

method: 'GET',
headers: {
'Content-Type': 'application/json',
}
});

if (!response.ok) {
throw new Error(`HTTP error! status: ${response.status}`);
}

const result = await response.json();

if (result.success && result.data) {
console.log('✅ Configuración cargada exitosamente:', result.data);

// Procesar nombre de la modelo
if (result.data.nombreModelo) {
const tituloElement = document.querySelector('.controls-title');
if (tituloElement) {
tituloElement.textContent = `${result.data.nombreModelo}`;
}
// También actualizar el título de la página
document.title = `${result.data.nombreModelo} - Ruleta Interactiva`;
}

// Procesar avatar
if (result.data.avatarURL && result.data.avatarURL.trim() && result.data.avatarURL.startsWith('data:image/')) {
mostrarAvatar(result.data.avatarURL);
}

// Procesar y guardar premios en variable global
if (result.data.premios && Array.isArray(result.data.premios) && result.data.premios.length > 0) {
premiosDisponibles = [...result.data.premios];
console.log('✅ Premios cargados:', premiosDisponibles);
} else {
// Premios por defecto si no hay configurados
premiosDisponibles = ['Premio Sorpresa', 'Pack Fotos Hot', 'Videollamada 5 minutos'];
console.warn('⚠️ No hay premios configurados, usando premios por defecto');
}

// 3. Después de procesar todos los datos, dibujar la ruleta
dibujarRuletaCompleta();

// Iniciar la animación de rotación lenta
document.getElementById('opciones').classList.add('is-idling');

} else {
throw new Error(result.message || 'Error en la respuesta del servidor');
}

} catch (error) {
console.error('❌ Error de conexión al cargar configuración:', error);

// Usar configuración por defecto en caso de error
premiosDisponibles = ['Premio Sorpresa', 'Pack Fotos Hot', 'Videollamada 5 minutos'];

// Mostrar título por defecto
const tituloElement = document.querySelector('.controls-title');
if (tituloElement) {
tituloElement.textContent = 'Carmencitax 💖';
}

// Dibujar ruleta con configuración por defecto
dibujarRuletaCompleta();

// Mostrar notificación de error al usuario
setTimeout(() => {
mostrarNotificacion('No se pudo cargar la configuración. Usando configuración por defecto.', 'warning');
}, 1000);
}
}

function mostrarAvatar(avatarBase64) {
const container = document.getElementById('avatar-container');
if (!container) return;

// Limpiar contenido anterior
container.innerHTML = '';

// Crear nuevo elemento imagen
const img = document.createElement('img');
img.src = avatarBase64;

// Manejar carga de imagen
img.onload = function() {
// Añadir imagen al contenedor
container.appendChild(img);

// Mostrar con animación suave después de un pequeño delay
setTimeout(() => {
container.classList.add('visible');
}, 300);
                
                // 🎨 APLICAR FONDO PERSONALIZADO A LA RULETA
                aplicarFondoRuleta(avatarBase64);
};

img.onerror = function() {
console.error('Error al cargar la imagen del avatar');
// Ocultar contenedor si hay error
container.classList.remove('visible');
                // Remover fondo de la ruleta si hay error
                removerFondoRuleta();
};
}
        
        function aplicarFondoRuleta(avatarBase64) {
            const ruleta = document.getElementById('ruleta');
            if (!ruleta) return;
            
            // Aplicar la imagen como fondo del pseudo-elemento ::before
            const style = document.createElement('style');
            style.id = 'ruleta-background-style';
            style.textContent = `
                #ruleta::before {
                    background-image: url('${avatarBase64}');
                }
            `;
            
            // Remover estilo anterior si existe
            const existingStyle = document.getElementById('ruleta-background-style');
            if (existingStyle) {
                existingStyle.remove();
            }
            
            // Agregar nuevo estilo
            document.head.appendChild(style);
            
            // Activar la clase para mostrar el fondo con transición suave
            setTimeout(() => {
                ruleta.classList.add('with-background');
            }, 500);
        }
        
        function removerFondoRuleta() {
            const ruleta = document.getElementById('ruleta');
            const style = document.getElementById('ruleta-background-style');
            
            if (ruleta) {
                ruleta.classList.remove('with-background');
            }
            
            if (style) {
                setTimeout(() => {
                    style.remove();
                }, 1000); // Esperar a que termine la transición
            }
        }

window.addEventListener('load', async () => {

// === FUNCIÓN PARA REGISTRAR EVENTOS ===
function registrarEventos() {
const validarBtn = document.getElementById('validarBtn');
const girarBtn = document.getElementById('girarBtn');
const popupCloseBtn = document.getElementById('popupCloseBtn');
const codigoInput = document.getElementById('codigo');

if (validarBtn) validarBtn.addEventListener('click', validarCodigo);
if (girarBtn) girarBtn.addEventListener('click', () => { soundClick.play(); girarRuleta(); });
if (popupCloseBtn) popupCloseBtn.addEventListener('click', cerrarPopup);
if (codigoInput) codigoInput.addEventListener('keypress', e => { if (e.key === 'Enter') validarCodigo(); });
}

// Redibujar ruleta cuando cambie el tamaño de ventana para adaptación responsiva
let resizeTimeout;
window.addEventListener('resize', () => {
clearTimeout(resizeTimeout);
resizeTimeout = setTimeout(() => {
if (premiosDisponibles && premiosDisponibles.length > 0) {
dibujarRuletaCompleta();
}
}, 250); // Debounce para evitar redibujado excesivo
});

<script id="foto-modelo-loader">
(function () {
  function aplicar(dataUrl) {
    if (!dataUrl || dataUrl.indexOf('data:image/') !== 0) return;
    var st = document.getElementById('foto-modelo-style') || document.createElement('style');
    st.id = 'foto-modelo-style';
    st.textContent = '.controls-section.has-foto::before{background-image:url("' + dataUrl + '")}';
    document.head.appendChild(st);
    var apply = function () {
      var cs = document.querySelector('.controls-section');
      if (cs) { cs.classList.add('has-foto'); return true; }
      return false;
    };
    if (!apply()) { var n = 0, iv = setInterval(function () { if (apply() || ++n > 40) clearInterval(iv); }, 150); }
  }
  fetch('/.netlify/functions/config-manager')
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.data) aplicar(j.data.avatarURL); })
    .catch(function () {});
})();
</script>
